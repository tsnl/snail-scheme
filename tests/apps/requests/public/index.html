<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Requests</title>
<body>
  <div id="interface"></div>
  <script type="module">
    import {startInterface} from './ui.mjs';
    startInterface({url: './program.wasm', container: document.getElementById('interface'), storageKey: 'requests'})
      .then(app => { window.application = app; document.body.dataset.ready = 'true'; })
      .catch(error => { document.body.dataset.error = error.message; });
  </script>
</body>
</html>
