<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hearsay prototypes</title>
<link rel="stylesheet" href="./style.css">
<style>
  /* The prototypes are mostly text: small type, narrow columns that leave
     the middle of the screen to the map, labels that keep their line
     breaks, and buttons that read like list items. */
  body { font-size: 12px; }
  .panel { max-width: 300px; gap: 3px; flex-direction: column; align-items: stretch; }
  .panel[data-key="contacts"] { max-width: 620px; flex-direction: row; }
  .panel[data-key="person"] { flex-direction: row; flex-wrap: wrap; }
  .panel[data-key="person"] .label { width: 100%; }
  .panel .image { align-self: flex-start; }
  .panel[data-key="rivals"] { display: grid; grid-template-columns: auto auto; align-items: center; }
  .label { white-space: pre-line; padding: 3px 8px; }
  .button { padding: 4px 8px; text-align: left; }
</style>
<body>
  <canvas id="view" tabindex="0" aria-label="Prototype board"></canvas>
  <div id="overlay"></div>
  <script type="module">
    import {startApplication} from './host.mjs';
    const overlay = document.getElementById('overlay');
    startApplication({url: './app.wasm', canvas: document.getElementById('view'), overlay, storageKey: 'hearsay'})
      .then(() => { document.body.dataset.ready = 'true'; })
      .catch(error => { document.body.dataset.error = error.message; overlay.textContent = error.message; });
  </script>
</body>
</html>
