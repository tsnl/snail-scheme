[book]
title = "snail-scheme"
authors = ["snail-scheme contributors"]
language = "en"
src = "doc/book"

[build]
build-dir = "build/book"
create-missing = false

# Colors each `scheme` block by the compiler's own lexical rules, through
# (snail shell highlight) in a `snail-scheme` program, after `links` has included the
# examples' text; highlight.js leaves those blocks alone.
[preprocessor.snail-highlight]
command = "scripts/highlight-book"
after = ["links"]
renderers = ["html"]

[output.html]
site-url = "/snail-scheme/"
additional-css = ["doc/highlight.css"]
git-repository-url = "https://github.com/tsnl/snail-scheme"
edit-url-template = "https://github.com/tsnl/snail-scheme/edit/main/doc/book/{path}"

[output.html.fold]
enable = true
level = 0

[output.html.playground]
runnable = false

# Pages that moved, for links and bookmarks to them. The Libraries chapter
# became the library reference (#903); its sections moved with it.
[output.html.redirect]
"/snail-scheme/projects.html" = "workspaces.html"
"/snail-scheme/libraries.html" = "../libraries/index.html"
"/snail-scheme/libraries.html#input-and-output-ports" = "../libraries/core.html#ports"
"/snail-scheme/libraries.html#files-and-directories" = "../libraries/core.html#files-and-directories"
"/snail-scheme/libraries.html#loading-webassembly" = "../libraries/system.html#snail-shell-wasm"
"/snail-scheme/libraries.html#wire-types" = "../libraries/data.html#snail-shell-wire"
