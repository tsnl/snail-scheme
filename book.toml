[book]
title = "Snail-Scheme"
authors = ["Snail-Scheme contributors"]
language = "en"
src = "doc/book"

[build]
build-dir = "build/book"
create-missing = false

[output.html]
site-url = "/snail-scheme/"
git-repository-url = "https://github.com/tsnl/snail-scheme"
edit-url-template = "https://github.com/tsnl/snail-scheme/edit/main/doc/book/{path}"

[output.html.fold]
enable = true
level = 0

[output.html.playground]
runnable = false
