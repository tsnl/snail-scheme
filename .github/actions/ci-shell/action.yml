name: Prepare the Snail CI shell
description: Restore the pinned environment and install the dependencies used by this job.
inputs:
  compiler:
    description: Prepare the compiler and Rust tools when this job will build programs.
    default: 'true'
runs:
  using: composite
  steps:
    # shell.nix reads its nixpkgs from npins/sources.json.
    - uses: cachix/install-nix-action@3c6342b75005b9cc7c7d4069c3e9179247c89012 # v31
    - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
      with:
        primary-key: nix-${{ runner.os }}-${{ hashFiles('shell.nix', 'npins/**') }}
        # An older store can already contain most of a newly pinned shell.
        restore-prefixes-first-match: nix-${{ runner.os }}-
    - if: inputs.compiler == 'true'
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: |
          ~/.rustup
          ~/.cargo/registry
          ~/.cargo/git
        key: rust-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
    # The driver uses two explicit Cargo target directories in addition
    # to the crate's test target. Caching downloads alone rebuilds the
    # assembler on every run.
    - name: Restore compiled Rust
      if: inputs.compiler == 'true'
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: |
          crates/snail-scheme-support/target
          build/wasm-snail-scheme-support
          build/wasm-snail-scheme-support-toolchain
          build/wasm-support-rapier
        key: cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('shell.nix', 'npins/**', 'rust-toolchain.toml', 'crates/*/Cargo.*') }}-${{ hashFiles('crates/*/src/**') }}
        restore-keys: |
          cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('shell.nix', 'npins/**', 'rust-toolchain.toml', 'crates/*/Cargo.*') }}-
    # The command line imports libraries under src/snail. Its executable
    # can be reused only for an exact match of their sources and toolchain.
    - name: Restore the bootstrapped command line
      if: inputs.compiler == 'true'
      id: compiler-cache
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: build/bootstrap/snail-scheme.wasm
        key: cli-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('shell.nix', 'npins/**', 'rust-toolchain.toml', 'bootstrap/**', 'scripts/bootstrap', 'scripts/build-runtime', 'host/chez/**', 'host/native/**', 'src/snail/**', 'crates/*/Cargo.*', 'crates/*/src/**') }}
    - name: Mark the exact command line cache current
      if: inputs.compiler == 'true' && steps.compiler-cache.outputs.cache-hit == 'true'
      shell: bash
      # Checkout gives unchanged sources new mtimes. The exact content key
      # above proves this command line is current for those sources.
      run: touch build/bootstrap/snail-scheme.wasm
    - name: Install Node dependencies
      shell: nix-shell --arg withBlender false --run "bash -euo pipefail {0}"
      run: npm ci --no-fund --no-audit
