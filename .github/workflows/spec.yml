name: Ott and Rocq

on:
  pull_request:
    paths:
      - doc/spec/**
      - scripts/spec
      - .github/workflows/spec.yml
  push:
    branches: [main]
    paths:
      - doc/spec/**
      - scripts/spec
      - .github/workflows/spec.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  specification:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3c6342b75005b9cc7c7d4069c3e9179247c89012 # v31
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: ott-rocq-${{ runner.os }}-${{ hashFiles('doc/spec/shell.nix') }}
      - name: Generate definitions, check proofs, and typeset rules
        run: nix-shell doc/spec/shell.nix --run scripts/spec
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ott-rocq-reference
          path: build/spec/
          if-no-files-found: error
          retention-days: 14
