name: Pages

on:
  pull_request:
    paths: &inputs
      - bootstrap/**
      - doc/book/**
      - doc/highlight.css
      - examples/**
      - crates/**
      - host/**
      - package.json
      - package-lock.json
      - scripts/**
      - src/**
      - tools/**
      - book.toml
      - snail-scheme
      - Makefile
      - rust-toolchain.toml
      - shell.nix
      - npins/**
      - .github/actions/ci-shell/action.yml
      - .github/workflows/pages.yml
  push:
    branches: [main]
    paths: *inputs
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the selected ref to the production Cloudflare Pages site
        type: boolean
        default: false

permissions:
  contents: read

env:
  # Use Bash from PATH so nix-shell does not probe <nixpkgs> for its shell.
  NIX_BUILD_SHELL: bash
  CARGO_INCREMENTAL: 0

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    # A cold runner builds the Rust tools and bootstraps the compiler first.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-shell
      - name: Build the book and its applications
        run: nix-shell --run 'make pages'
      - name: Pass the built site to the deploy job
        if: &publish github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: public-site
          path: build/pages
          if-no-files-found: error
          retention-days: 1

  deploy:
    if: *publish
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: public-site
          path: site
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Deploy the book and its applications
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: '4.164.0'
          command: pages deploy site --project-name=snail-scheme --branch=main --commit-hash=${{ github.sha }}
