name: Book and Pages

on:
  pull_request:
    paths:
      - doc/book/**
      - apps/siegework/**
      - src/**
      - bootstrap/**
      - book.toml
      - scripts/book
      - scripts/build-pages.mjs
      - scripts/check-pages.mjs
      - scripts/run-lofi-generator.mjs
      - tests/pages.mjs
      - tests/pages-browser.mjs
      - shell.nix
      - .github/workflows/pages.yml
  push:
    branches: [main]
    paths:
      - doc/book/**
      - apps/siegework/**
      - src/**
      - bootstrap/**
      - book.toml
      - scripts/book
      - scripts/build-pages.mjs
      - scripts/check-pages.mjs
      - scripts/run-lofi-generator.mjs
      - tests/pages.mjs
      - tests/pages-browser.mjs
      - shell.nix
      - .github/workflows/pages.yml
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this ref to Pages (subject to the github-pages environment rules)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3c6342b75005b9cc7c7d4069c3e9179247c89012 # v31
        with:
          nix_path: nixpkgs=https://github.com/NixOS/nixpkgs/archive/dc5d91f840324650bac8c379428c7037a416959a.tar.gz
      - name: Build and check the book and Siegework
        run: nix-shell -p chibi binaryen nodejs mdbook --run 'node scripts/build-pages.mjs && node tests/pages.mjs build/pages'
      - name: Upload Pages artifact
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.publish)
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: build/pages

  deploy:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy the book and games
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
