name: Pages

on:
  pull_request:
    paths: &inputs
      - bootstrap/**
      - doc/book/**
      - doc/highlight.css
      - examples/**
      - crates/**
      - host/**
      - package.json
      - package-lock.json
      - scripts/**
      - src/**
      - tools/**
      - book.toml
      - snail-scheme
      - Makefile
      - rust-toolchain.toml
      - shell.nix
      - npins/**
      - .github/actions/ci-shell/action.yml
      - .github/workflows/pages.yml
  push:
    branches: [main]
    paths: *inputs
  workflow_dispatch:

permissions:
  contents: read

env:
  # Use Bash from PATH so nix-shell does not probe <nixpkgs> for its shell.
  NIX_BUILD_SHELL: bash
  CARGO_INCREMENTAL: 0

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    # A cold runner builds the Rust tools and bootstraps the compiler first.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-shell
      - name: Build the book and its applications
        run: nix-shell --run 'make pages'
