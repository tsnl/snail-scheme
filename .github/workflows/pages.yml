name: Pages

on:
  pull_request:
    paths: &inputs
      - apps/siegework/**
      - bootstrap/**
      - doc/**
      - examples/**
      - host/**
      - lib/**
      - scripts/**
      - src/**
      - book.toml
      - lofi
      - Makefile
      - rust-toolchain.toml
      - shell.nix
      - npins/**
      - .github/workflows/pages.yml
  push:
    branches: [main]
    paths: *inputs
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this ref to Pages (subject to the github-pages environment rules)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      # shell.nix reads its nixpkgs from npins/sources.json.
      - uses: cachix/install-nix-action@3c6342b75005b9cc7c7d4069c3e9179247c89012 # v31
      # `lofi build` compiles src/runtime and src/assembler for WASI with
      # `cargo --offline`, so this job needs the target and the locked crates
      # in the registry, exactly as the test job does.
      - name: Install pinned Rust and fetch locked dependencies
        run: nix-shell --run 'rustup toolchain install && rustup target add wasm32-wasip1 && make fetch'
      - name: Build the book and Siegework
        run: nix-shell --run 'make pages'
      - name: Upload Pages artifact
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.publish)
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: build/pages

  deploy:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy the book and Siegework
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
