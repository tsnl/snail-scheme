name: Pages

on:
  pull_request:
    paths: &inputs
      - src/apps/siegework/**
      - bootstrap/**
      - doc/**
      - examples/**
      - crates/**
      - host/**
      - scripts/**
      - src/**
      - tools/**
      - book.toml
      - snail
      - Makefile
      - rust-toolchain.toml
      - shell.nix
      - npins/**
      - .github/workflows/pages.yml
  push:
    branches: [main]
    paths: *inputs
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this ref to snail-scheme.tsnl.xyz (subject to the cloudflare environment rules)
        type: boolean
        default: false

permissions:
  contents: read

env:
  # Use Bash from PATH so nix-shell does not probe <nixpkgs> for its shell.
  NIX_BUILD_SHELL: bash

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    # A cold runner builds the Rust tools and bootstraps the compiler first.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      # shell.nix reads its nixpkgs from npins/sources.json.
      - uses: cachix/install-nix-action@3c6342b75005b9cc7c7d4069c3e9179247c89012 # v31
      # `snail-scheme build` compiles crates/snail-scheme-support for WASI with
      # `cargo --offline`, so this job needs the target and the locked crates
      # in the registry, exactly as the test job does.
      - name: Install pinned Rust and fetch locked dependencies
        run: nix-shell --run 'rustup toolchain install && rustup target add wasm32-wasip1 && make fetch'
      - name: Build the book and Siegework
        run: nix-shell --run 'make pages'
      - name: Upload the site
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.publish)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: site
          path: build/pages
          retention-days: 1

  # Publishes build/pages as the Worker wrangler.jsonc describes, at
  # https://snail-scheme.tsnl.xyz. The `cloudflare` environment holds
  # CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID; the build job never sees
  # them. The repository is public, so the environment, not this file, is
  # what guards them: a pull request can edit this job but not the
  # environment, which releases its secrets only to runs from main and only
  # after tsnl approves each one, with no admin bypass. Keep the two as
  # environment secrets: repository secrets reach any branch's workflow.
  deploy:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: cloudflare
      url: https://snail-scheme.tsnl.xyz
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          sparse-checkout: wrangler.jsonc
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: site
          path: build/pages
      - name: Deploy the book and Siegework
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.164.0 deploy
