name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RUSTUP_TOOLCHAIN: 1.95.0
  CARGO_TERM_COLOR: always

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3c6342b75005b9cc7c7d4069c3e9179247c89012 # v31
        with:
          nix_path: nixpkgs=https://github.com/NixOS/nixpkgs/archive/dc5d91f840324650bac8c379428c7037a416959a.tar.gz
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('shell.nix', '.github/workflows/ci.yml') }}
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.rustup
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-${{ runner.os }}-1.95.0-${{ hashFiles('**/Cargo.lock') }}
      - name: Install pinned Rust and fetch locked dependencies
        shell: nix-shell --run "bash -euo pipefail {0}"
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --target wasm32-wasip1
          cargo fetch --locked --manifest-path src/runtime/Cargo.toml
      - name: Run checks
        shell: nix-shell --run "bash -euo pipefail {0}"
        run: |
          make check
          cargo test --manifest-path src/runtime/Cargo.toml --offline
          cargo fmt --manifest-path src/runtime/Cargo.toml --all -- --check
          make test
      - name: Retain build evidence
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: build
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build/tests/**/*.wat
