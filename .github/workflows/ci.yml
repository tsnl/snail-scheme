name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Use Bash from PATH so nix-shell does not probe <nixpkgs> for its shell.
  NIX_BUILD_SHELL: bash
  # CI reuses Cargo's compiled dependencies, not incremental edit history.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  tests:
    # The name is the status check that the ruleset for main requires.
    name: Complete correctness checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      # shell.nix reads its nixpkgs from npins/sources.json.
      - uses: cachix/install-nix-action@3c6342b75005b9cc7c7d4069c3e9179247c89012 # v31
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('shell.nix', 'npins/sources.json', '.github/workflows/ci.yml') }}
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.rustup
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
      # The driver uses three explicit Cargo target directories in addition
      # to the two crates' test targets. Caching downloads alone rebuilds
      # Wasmtime and the WASI assembler on every run.
      - name: Restore compiled Rust
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            crates/snail-core-support/target
            crates/snail/target
            build/native-snail
            build/wasm-snail-core-support
            build/wasm-snail-core-support-toolchain
          key: cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('shell.nix', 'npins/**', 'rust-toolchain.toml', 'crates/*/Cargo.*') }}-${{ hashFiles('crates/*/src/**') }}
          restore-keys: |
            cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('shell.nix', 'npins/**', 'rust-toolchain.toml', 'crates/*/Cargo.*') }}-
      # Only an exact source/toolchain match may reuse the bootstrap. Never
      # restore the CPU-specific .cwasm or generated test outputs.
      - name: Restore bootstrapped compiler
        id: compiler-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/compiler/snailc.wasm
          key: compiler-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('shell.nix', 'npins/**', 'rust-toolchain.toml', 'bootstrap/**', 'scripts/**', 'host/chibi/**', 'host/native/**', 'host/browser/**', 'src/snail/core/**', 'src/snail/shell/compiler.sld', 'src/snail/shell/compiler/**', 'crates/*/Cargo.*', 'crates/*/src/**') }}
      - name: Mark the exact compiler cache current
        if: steps.compiler-cache.outputs.cache-hit == 'true'
        # Checkout gives unchanged sources new mtimes. The exact content key
        # above proves this compiler is current for those sources.
        run: touch build/compiler/snailc.wasm
      - name: Install pinned Rust and fetch locked dependencies
        shell: nix-shell --run "bash -euo pipefail {0}"
        run: |
          # rust-toolchain.toml names the version, its components and target.
          rustup toolchain install
          make fetch
      - name: Check formatting
        shell: nix-shell --run "bash -euo pipefail {0}"
        run: |
          make check
          cargo fmt --manifest-path crates/snail-core-support/Cargo.toml --all -- --check
          cargo fmt --manifest-path crates/snail/Cargo.toml --all -- --check
      - name: Test Rust support
        shell: nix-shell --run "bash -euo pipefail {0}"
        run: cargo test --manifest-path crates/snail-core-support/Cargo.toml --offline --all-features
      - name: Test native host
        shell: nix-shell --run "bash -euo pipefail {0}"
        run: cargo test --manifest-path crates/snail/Cargo.toml --offline
      - name: Build compiler and development tools
        shell: nix-shell --run "bash -euo pipefail {0}"
        run: ./scripts/snail-tool dev-tools >/dev/null
      - name: Test Snail
        shell: nix-shell --run "bash -euo pipefail {0}"
        run: make test
      - name: Retain build evidence
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: build
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build/tests/**/*.wat
