name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Use Bash from PATH so nix-shell does not probe <nixpkgs> for its shell.
  NIX_BUILD_SHELL: bash
  # CI reuses Cargo's compiled dependencies, not incremental edit history.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  language:
    name: Language and toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-shell
      - name: Check formatting
        shell: nix-shell --run "bash -euo pipefail {0}"
        run: |
          make check
          cargo fmt --manifest-path crates/snail-scheme-support/Cargo.toml --all -- --check
      - name: Test Rust support
        shell: nix-shell --run "bash -euo pipefail {0}"
        run: cargo test --manifest-path crates/snail-scheme-support/Cargo.toml --offline --all-features
      - name: Bootstrap the command line
        shell: nix-shell --run "bash -euo pipefail {0}"
        run: ./scripts/bootstrap >/dev/null
      - name: Test snail-scheme
        shell: nix-shell --run "bash -euo pipefail {0}"
        run: make test
      - name: Retain build evidence
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: build
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build/tests/**/*.wat

  gpu:
    name: WebGPU on lavapipe
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      # Cache the executable, then always run it on today's runner and check
      # its output. The GPU program imports the Snail libraries and its own
      # tests/gpu/src tree. Its generated shaders live under those roots too.
      - name: Restore the GPU test package
        id: gpu-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/ci-gpu
          key: >-
            gpu-node-v1-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('shell.nix', 'npins/**', 'rust-toolchain.toml', 'package*.json',
                      'snail-scheme', 'scripts/bootstrap', 'bootstrap/**', 'host/**',
                      'crates/*/Cargo.*', 'crates/*/src/**', 'src/snail/**',
                      'tests/gpu/node.scm', 'tests/gpu/src/**', 'tests/gpu/node.resources/**',
                      'tests/gpu/public/**') }}
      - uses: ./.github/actions/ci-shell
        with:
          compiler: ${{ steps.gpu-cache.outputs.cache-hit != 'true' }}
      - name: Compile the GPU checks
        if: steps.gpu-cache.outputs.cache-hit != 'true'
        shell: nix-shell --run "bash -euo pipefail {0}"
        run: |
          package=$(./snail-scheme build --target node tests/gpu/node.scm)
          # The published name is a symlink to a generation. Keep its files.
          mkdir -p build/ci-gpu
          cp -R "$package/." build/ci-gpu/
      - name: Test the GPU checks on lavapipe
        shell: nix-shell --run "bash -euo pipefail {0}"
        run: node tests/gpu.mjs "$PWD" "$PWD/build/ci-gpu"

  tests:
    # Keep the status name used by branch protection. Fail if either suite failed.
    name: Complete correctness checks
    needs: [language, gpu]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Require both suites to pass
        env:
          LANGUAGE_RESULT: ${{ needs.language.result }}
          GPU_RESULT: ${{ needs.gpu.result }}
        run: test "$LANGUAGE_RESULT" = success && test "$GPU_RESULT" = success
