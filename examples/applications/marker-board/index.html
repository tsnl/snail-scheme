<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marker board</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main>
    <h1>Marker board</h1>
    <p>Move the pointer to choose a cell. Click or press Enter to move and save the orange marker.</p>
    <canvas width="320" height="240" tabindex="0" aria-label="Saved marker board"></canvas>
    <p data-status>Loading board…</p>
    <p data-connection>Connecting…</p>
    <button data-handler="confirm">Place marker</button>
    <button data-handler="restart">Reset marker</button>
    <p>The marker is saved in this browser. Close this tab before reopening the same save in another tab.</p>
  </main>
  <script type="module" data-application-entry></script>
</body>
</html>
