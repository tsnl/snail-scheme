  <g id="text_20">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #526170" transform="translate(62.208 282.4704)">Bars show medians; whiskers show the measured range. Lower is faster.</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #526170" transform="translate(62.208 296.8704)">Each implementation matches its own validated Chibi reference.</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #526170" transform="translate(62.208 311.2704)">Preparation, process startup, assembly, and linking are excluded.</text>
  </g>
