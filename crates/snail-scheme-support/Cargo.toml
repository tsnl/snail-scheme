[package]
name = "snail-scheme-support"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
autotests = false

[lib]
crate-type = ["rlib"]

# The toolchain's runtime: tools written in `snail-scheme`, such as the `snail-scheme`
# command line, assemble and link modules in-process with this feature. Programs never need it, and a development build copies its
# runtime whole, so the plain runtime leaves it out.
[features]
assembler = ["dep:wat", "dep:wasm-fuse", "dep:wasm-encoder", "dep:wasmparser"]

# Stage 0's linker, built for this machine: the bootstrap links the command
# line with it, before there is a command line to link anything.
[[bin]]
name = "snail-link"
required-features = ["assembler"]

[dependencies]
wat = { version = "1.262.0", default-features = false, optional = true }
wasm-fuse = { version = "4.0.0", default-features = false, optional = true }
wasm-encoder = { version = "0.256.0", features = ["wasmparser"], optional = true }
wasmparser = { version = "0.256.0", optional = true }

[profile.release]
panic = "abort"
lto = true
codegen-units = 1

# The reference (snail shell math) is tested against (examples/math-reference).
[dev-dependencies]
libm = "=0.2.16"
