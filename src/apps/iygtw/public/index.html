<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#efece3">
<title>Walking study · If You’re Going That Way</title>
<link rel="stylesheet" href="./walking.css">
<header><span>If You’re Going That Way</span></header>
<main>
  <h1>Walking study</h1>
  <div id="study"><p>Loading the walker…</p></div>
  <p class="note">Six powered leg joints track a captured stride. The feet meet the ground sampled from Willowbank. <a href="./CREDITS.txt">Motion credits</a></p>
</main>
<canvas id="host" hidden></canvas>
<script type="module">
  import {startApplication} from './host.mjs';
  const study = document.querySelector('#study');
  try {
    await startApplication({canvas: document.querySelector('#host'), overlay: study});
    document.body.dataset.ready = 'true';
  } catch (error) {
    document.body.dataset.error = String(error);
    study.textContent = String(error);
  }
</script>
</html>
