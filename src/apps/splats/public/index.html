<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Splats</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #ddd; font: 13px system-ui, sans-serif; }
  canvas { display: block; width: 100%; height: 100%; outline: none; }
  #panel { position: fixed; left: 12px; top: 10px; max-width: 34em; padding: 8px 12px; background: #000a; border-radius: 6px; }
  #panel summary { cursor: pointer; font-weight: 600; }
  #panel p { margin: 6px 0; line-height: 1.5; }
  #status { color: #fc9; }
  #status:empty { display: none; }
  #keys { position: fixed; left: 12px; bottom: 10px; pointer-events: none; text-shadow: 0 1px 2px #000; }
</style>
<body>
  <canvas id="view" tabindex="0" aria-label="Gaussian splats"></canvas>
  <div id="panel">
  <details id="open" open>
    <summary>Open a trained scene</summary>
    <p>Drop a 3D Gaussian Splatting .ply anywhere on the page, or press O to pick files.</p>
    <p>Add the scene's COLMAP <code>images.bin</code> and its cameras say which way is up and where the view starts.</p>
  </details>
  <p id="status" role="status"></p>
  </div>
  <div id="keys">Drag to look, WASD to fly, Q and E down and up, wheel for speed.</div>
  <script type="module">
    import {startApplication} from './host.mjs';
    // The panel folds away once something is dropped.
    const status = document.getElementById('status');
    addEventListener('drop', () => { document.getElementById('open').open = false; });
    startApplication({canvas: document.getElementById('view'), overlay: status, storageKey: 'splats'})
      .then(() => { document.body.dataset.ready = 'true'; })
      .catch(error => { document.body.dataset.error = error.message; status.textContent = error.message; });
  </script>
</body>
</html>
