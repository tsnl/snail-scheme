<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171c28">
  <title>Last Mile Taxi · San Francisco</title>
  <link rel="stylesheet" href="./street.css">
</head>
<body>
  <canvas id="view" tabindex="0" aria-label="Taxi driving in San Francisco"></canvas>
  <div id="overlay"></div>
  <p id="status" role="status">Opening your San Francisco shift… The first visit downloads the city.</p>
  <footer class="keys"><span>Click to look · Esc releases</span><span><kbd>WASD</kbd> Move / drive</span><span><kbd>B</kbd> Brake</span><span><kbd>E</kbd> Board / exit</span><span><kbd>M</kbd> City map</span><span><kbd>L</kbd> Later shift</span><span><kbd>P</kbd> Pause</span></footer>
  <aside class="map-credit"><a href="https://www.openstreetmap.org/copyright">© OpenStreetMap contributors</a> · <a href="./geodata/SOURCES.txt">USGS 3DEP</a> · <a href="./geodata/city.json">Map data</a></aside>
  <script type="module">
    import {startApplication} from './host.mjs';
    const overlay = document.getElementById('overlay');
    const status = document.getElementById('status');
    function failed(message) {
      document.body.dataset.error = message;
      status.hidden = false;
      status.textContent = 'Last Mile Taxi needs a WebGPU device and its scene assets. ' + message;
    }
    addEventListener('error', event => failed(event.message));
    try {
      await startApplication({canvas: document.getElementById('view'), overlay, pointerLock: true, storageKey: 'last-mile-sf-taxi-v1'});
      if (!document.body.dataset.error) {
        status.hidden = true;
        document.body.dataset.ready = 'true';
      }
    } catch (error) {
      failed(error.message);
    }
  </script>
</body>
</html>
