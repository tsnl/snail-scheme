<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171c28">
  <title>Last Mile · Mercer Street</title>
  <link rel="stylesheet" href="./street.css">
</head>
<body>
  <canvas id="view" tabindex="0" aria-label="Third-person view of Mercer Street"></canvas>
  <div id="overlay"></div>
  <p id="status" role="status">Loading Mercer Street…</p>
  <footer class="keys"><span><kbd>W</kbd><kbd>S</kbd> Drive / brake</span><span><kbd>A</kbd><kbd>D</kbd> Steer</span><span><kbd>E</kbd> Use</span><span><kbd>Space</kbd> Fire</span><span><kbd>P</kbd> Pause</span></footer>
  <script type="module">
    import {startApplication} from './host.mjs';
    const overlay = document.getElementById('overlay');
    const status = document.getElementById('status');
    function failed(message) {
      document.body.dataset.error = message;
      status.hidden = false;
      status.textContent = 'Last Mile needs a WebGPU device and its scene assets. ' + message;
    }
    addEventListener('error', event => failed(event.message));
    try {
      await startApplication({canvas: document.getElementById('view'), overlay, storageKey: 'last-mile-mercer-v1'});
      if (!document.body.dataset.error) {
        status.hidden = true;
        document.body.dataset.ready = 'true';
      }
    } catch (error) {
      failed(error.message);
    }
  </script>
</body>
</html>
